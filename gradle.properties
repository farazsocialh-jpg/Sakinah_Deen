# Project-wide Gradle settings for the ImanCore Android build.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Robolectric screenshot tests read the merged resources/manifest of the debug variant.
android.testOptions.unitTests.includeAndroidResources=true

# Jetpack Compose, Room, Media3 and Koin all ship as AndroidX artifacts.
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
