appId: com.imancore.app
---
- launchApp:
    clearState: true
- assertVisible: "As-salamu alaykum"
- takeScreenshot: "01_welcome"
- tapOn: { id: "onboarding_name_input" }
- inputText: "Faraz"
- hideKeyboard
- tapOn: "Continue"
- assertVisible: "Make it yours, Faraz"
- tapOn: "Dark"
- takeScreenshot: "02_appearance"
- tapOn: "Continue"
- assertVisible: "Select all of the above"
- takeScreenshot: "03_goals"
- tapOn: "Continue"
- assertVisible: "Search languages..."
- takeScreenshot: "04_language"
- tapOn: "Continue"
- assertVisible: "Select your preferred translation style across Quran, WBW, Hadith, and Tafseer."
- takeScreenshot: "05_edition"
- tapOn: "Continue"
- assertVisible: "Choose your English Tafsir"
- tapOn: "Download later"
- takeScreenshot: "06_tafsir"
- tapOn: "Continue"
- assertVisible: "You're all set, Faraz"
- takeScreenshot: "07_permissions"
- tapOn: "Continue"
- assertVisible: "Start Using Sakinah"
- takeScreenshot: "08_first_win"
- tapOn: "Start Using Sakinah"
