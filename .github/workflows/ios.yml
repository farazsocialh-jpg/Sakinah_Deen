name: iOS

# The iOS side of the pipeline: shared Kotlin framework, generated Xcode project, simulator
# build and the SwiftUI UI tests.
#
# Runs when the code that can break it changes (iOS sources, shared KMP sources, build
# configuration) instead of on every main push. `shared/**` is included because an iOS compile
# break almost always starts in `commonMain` or `iosMain`. Tag pushes are deliberately
# unfiltered so a release tag always validates the iOS build.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'ios/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# A macOS runner is the most expensive slot in this repository, so a superseded PR run is
# cancelled; a tag or main run is not, because it is release evidence.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-shared-and-ios:
    name: Build shared framework, iOS app and UI tests
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # One invocation: `:shared:build` compiles the iOS frameworks and `:shared:allTests` runs the
      # shared tests explicitly (Gradle de-duplicates the work `check` already covers).
      - name: Build shared KMP framework and run shared tests
        run: ./gradlew :shared:build :shared:allTests --stacktrace --no-daemon

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # The Swift target is where Kotlin/Native interop mistakes surface (an unexported
      # initializer, a suspend function that Swift imports as `async throws`). Keeping this
      # step separate from the test step makes the failure readable.
      - name: Build the iOS app (simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Sakinah.xcodeproj \
            -scheme Sakinah \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Resolve a bootable iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in sorted(d) for x in d[runtime] if x["name"].startswith("iPhone")))')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run iOS UI tests
        run: |
          xcodebuild test \
            -project ios/Sakinah.xcodeproj \
            -scheme Sakinah \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:SakinahUITests \
            -resultBundlePath "$RUNNER_TEMP/SakinahUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-results
          path: ${{ runner.temp }}/SakinahUITests.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Xcode build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/DerivedData/Logs/**
          if-no-files-found: ignore
          retention-days: 7
