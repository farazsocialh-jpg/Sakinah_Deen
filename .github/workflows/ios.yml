name: iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-shared-and-ios:
    name: Build shared framework and iOS app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build shared KMP framework (iOS targets)
        run: ./gradlew :shared:build --stacktrace --no-daemon

      - name: Run shared KMP tests
        run: ./gradlew :shared:allTests --stacktrace --no-daemon

      - name: Build iOS app (if Xcode project present)
        run: |
          if ls ios/**/*.xcodeproj >/dev/null 2>&1; then
            xcodebuild -project ios/Sakinah.xcodeproj -scheme Sakinah -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' build
          else
            echo "No Xcode project checked in yet; shared framework build verified above."
          fi
