name: Release

# Produces a Play-ready signed AAB from repository secrets.
# See docs/release-signing.md for the one-time keystore + secret setup.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.0). Leave blank to use the tag or 1.0.0.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-bundle:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name (see docs/release-signing.md)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Resolve version metadata
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION_NAME" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building version $VERSION_NAME (code ${GITHUB_RUN_NUMBER})"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakinah_release.jks"
          test -s "$RUNNER_TEMP/sakinah_release.jks"
          echo "Keystore decoded ($(wc -c < "$RUNNER_TEMP/sakinah_release.jks") bytes)"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed AAB and APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sakinah_release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
          NISAB_RATE_URL: ${{ secrets.NISAB_RATE_URL }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab > /dev/null
          echo "AAB signature verified"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sakinah-release-aab-${{ env.VERSION_NAME }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sakinah-release-apk-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping for crash deobfuscation
        uses: actions/upload-artifact@v4
        with:
          name: sakinah-mapping-${{ env.VERSION_NAME }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90
