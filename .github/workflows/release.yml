name: Release

# Produces a Play-ready signed AAB from repository secrets.
# See docs/release-signing.md for the one-time keystore + secret setup.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.0). Leave blank to use the tag or 1.0.0.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-bundle:
    name: Build signed AAB
    runs-on: ubuntu-latest
    environment: Playstore
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name (see docs/release-signing.md)"
              missing=1
            fi
          done
          # Not fatal: the app builds without it, but "Continue with Google" would only
          # show the inline "not configured" notice in the shipped build.
          if [ -z "${GOOGLE_WEB_CLIENT_ID:-}" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID secret is not set — Google Sign-In will be disabled in this build."
          fi
          exit "$missing"

      - name: Resolve version metadata
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION_NAME" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building version $VERSION_NAME (code ${GITHUB_RUN_NUMBER})"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/sakinah_release.jks"
          test -s "$RUNNER_TEMP/sakinah_release.jks"
          echo "Keystore decoded ($(wc -c < "$RUNNER_TEMP/sakinah_release.jks") bytes)"

      - name: Print signing certificate fingerprints
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # The SHA-1 of this certificate is the value to register in the Google Cloud Console
          # "Android OAuth client" (package com.imancore.app) for Credential Manager sign-in.
          # Fingerprints are public certificate metadata, never secret material.
          keytool -list -v \
            -keystore "$RUNNER_TEMP/sakinah_release.jks" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            > "$RUNNER_TEMP/signing-cert.txt" 2>&1
          SHA1=$(grep -m1 'SHA1:' "$RUNNER_TEMP/signing-cert.txt" | sed 's/.*SHA1: //')
          SHA256=$(grep -m1 'SHA256:' "$RUNNER_TEMP/signing-cert.txt" | sed 's/.*SHA256: //')
          if [ -z "$SHA1" ]; then
            echo "::error::Could not read the certificate fingerprint for alias $KEY_ALIAS"
            cat "$RUNNER_TEMP/signing-cert.txt" >&2
            exit 1
          fi
          echo "Certificate alias: $KEY_ALIAS"
          echo "SHA-1: $SHA1"
          echo "SHA-256: $SHA256"
          {
            echo "### Release signing certificate"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Alias | \`$KEY_ALIAS\` |"
            echo "| SHA-1 | \`$SHA1\` |"
            echo "| SHA-256 | \`$SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests and lint before release
        run: ./gradlew :shared:allTests :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon

      - name: Build signed AAB and APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sakinah_release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
          NISAB_RATE_URL: ${{ secrets.NISAB_RATE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab \
            > "$RUNNER_TEMP/aab-signature.txt" 2>&1
          grep -q "jar verified" "$RUNNER_TEMP/aab-signature.txt"
          echo "AAB JAR signature verified."

      # A valid signature only proves that *a* key signed the artifact. This proves the
      # production key signed it (not a debug or CI key) and that the artifact carries the
      # version this run resolved. Publishing an unverified release is worse than failing here.
      - name: Verify APK signature, signer identity and version
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          # Non-zero exit when the APK is unsigned or the signature is invalid.
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"

          EXPECTED=$(keytool -list -v -keystore "$RUNNER_TEMP/sakinah_release.jks" \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
            | awk -F': ' '/SHA256:/{print $2; exit}')
          ACTUAL=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
            "$RUNNER_TEMP/apksigner.txt")
          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the certificate digests (expected='$EXPECTED' actual='$ACTUAL')."
            exit 1
          fi
          if [ "$(echo "$EXPECTED" | tr 'A-F' 'a-f' | tr -d ' ')" != \
               "$(echo "$ACTUAL" | tr 'A-F' 'a-f' | tr -d ' ')" ]; then
            echo "::error::The release APK is not signed by the configured production key."
            exit 1
          fi
          echo "APK signed by the configured production certificate."

          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -E '^package:' || true
          if ! echo "$BADGING" | grep -q "versionName='$VERSION_NAME'"; then
            echo "::error::APK versionName does not match the resolved release version $VERSION_NAME."
            exit 1
          fi
          if ! echo "$BADGING" | grep -q "versionCode='$VERSION_CODE'"; then
            echo "::error::APK versionCode does not match the resolved release code $VERSION_CODE."
            exit 1
          fi
          echo "Artifact version $VERSION_NAME ($VERSION_CODE) verified."
          {
            echo "### Verified release artifact"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION_NAME\` (\`$VERSION_CODE\`) |"
            echo "| Signer | production keystore, SHA-256 matched |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: sakinah-release-aab-${{ env.VERSION_NAME }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: sakinah-release-apk-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping for crash deobfuscation
        uses: actions/upload-artifact@v7
        with:
          name: sakinah-mapping-${{ env.VERSION_NAME }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90
