name: Worker

# Tests the AI Scholar proxy Worker on every push. No Cloudflare account or API key is
# needed: the suite drives the exported handler and helpers directly, and the dry-run bundle
# only checks that wrangler can build the Worker and read its bindings.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: worker

jobs:
  test:
    name: Lint and test the Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: node --check src/index.js

      - name: Run unit tests
        run: npm test

      - name: Validate the Wrangler configuration and bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
        env:
          WRANGLER_SEND_METRICS: 'false'
