name: Security

# Static and data-flow security analysis for the app, the shared KMP module and the Worker.
#
#   static-audit           embedded audit checklist, mobsfscan (OWASP MASVS), Gitleaks
#   codeql                 data-flow analysis of Kotlin/Java
#   dependency-submission  resolved Gradle graph (transitive CVEs reach Dependabot)
#   report                 merged SECURITY_AUDIT.md for this workflow
#
# Scanner results are handled by `.github/scripts/security-scan-gate.py`: a scanner that did not
# really run is reported as a scanner failure, never as a clean scan, and the blocking/advisory
# policy is documented in docs/SECURITY_SCANNING.md.
#
# This workflow is separate from ci.yml so that a change that cannot affect the Android build
# (iOS sources, Worker sources) still gets secret scanning and CodeQL, while a docs-only change
# gets nothing. The APK security scan needs the APK, so it stays in ci.yml next to the job that
# builds it. Path filters and the trigger matrix: docs/CI_CD_AUDIT.md.

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'ios/**'
      - 'worker/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'google-services.json'
      - '.gitleaks.toml'
      - '.github/workflows/security.yml'
      - '.github/scripts/**'
      - '.github/audit-baseline.json'
      - '.github/security-scan-baseline.json'
  pull_request:
    paths:
      - 'app/**'
      - 'shared/**'
      - 'ios/**'
      - 'worker/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'google-services.json'
      - '.gitleaks.toml'
      - '.github/workflows/security.yml'
      - '.github/scripts/**'
      - '.github/audit-baseline.json'
      - '.github/security-scan-baseline.json'
  schedule:
    - cron: '0 4 * * 1'   # weekly drift check: new CVEs, new lint rules, new permissions
  workflow_dispatch:
    inputs:
      strict:
        description: 'Audit: fail on every known gap, not only on regressions'
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

# PR runs are superseded by the next push. A main-branch or scheduled run is never cancelled:
# the weekly scan is this repository's only periodic security baseline.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --------------------------------------------------------- static audit (fast)
  static-audit:
    name: Audit checklist, mobsfscan, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the embedded audit checklist
        env:
          STRICT: ${{ inputs.strict && '--strict' || '' }}
        run: python3 .github/scripts/audit-checklist.py $STRICT

      - name: mobsfscan (OWASP mobile static analysis)
        run: |
          mkdir -p audit-report
          # An isolated venv avoids PEP 668 / system-site permission failures on runners.
          python3 -m venv "$RUNNER_TEMP/mobsfscan-venv"
          "$RUNNER_TEMP/mobsfscan-venv/bin/pip" install --quiet --disable-pip-version-check mobsfscan
          # mobsfscan exits 1 when it has findings and 0 when it does not, and it also exits 0
          # when its targets do not exist — the exit code alone cannot tell a finding from a
          # scanner that scanned nothing. The gate proves execution from the report before it
          # applies the documented blocking/advisory policy.
          set +e
          "$RUNNER_TEMP/mobsfscan-venv/bin/mobsfscan" \
            --sarif -o audit-report/mobsfscan.sarif app/src shared/src
          rc=$?
          set -e
          echo "mobsfscan exit code: $rc"
          if [ "$rc" -gt 1 ]; then
            echo "::error::mobsfscan failed to execute (exit $rc); this run has no scan result."
            exit 1
          fi
          python3 .github/scripts/security-scan-gate.py \
            --tool mobsfscan \
            --sarif audit-report/mobsfscan.sarif \
            --report audit-report/mobsfscan.md \
            --target app/src --target shared/src

      - name: Gitleaks (committed secrets)
        run: |
          mkdir -p audit-report
          # --exit-code 1 makes a detected secret fail the scan instead of only being written
          # to the report. docker's own failures (125/126/127) are still distinguishable from
          # findings (1), and the gate rejects a missing or unreadable report.
          set +e
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --report-format=sarif --report-path=/repo/audit-report/gitleaks.sarif \
            --no-banner --redact --exit-code 1
          rc=$?
          set -e
          echo "gitleaks exit code: $rc"
          if [ "$rc" -gt 1 ]; then
            echo "::error::Gitleaks failed to execute (exit $rc); this run has no scan result."
            exit 1
          fi
          python3 .github/scripts/security-scan-gate.py \
            --tool gitleaks \
            --sarif audit-report/gitleaks.sarif \
            --report audit-report/gitleaks.md

      # Only runs where the token may write security events: a fork PR gets a read-only token
      # and would fail here for a permission reason, not because of a finding.
      - name: Upload SARIF findings
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: audit-report
          category: static-audit

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-static
          path: audit-report/
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------------- CodeQL
  codeql:
    name: CodeQL (data-flow security analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The java-kotlin extractor needs the JDK present when it initializes, otherwise it can
      # start without instrumentation and the analysis then processes no Kotlin/Java code.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The extractor only records what javac/kotlinc actually compile. `gradle.properties`
      # enables `org.gradle.caching` and the Gradle user home restored by setup-java carries
      # `caches/build-cache-1`, so without the two flags below every task here is served
      # FROM-CACHE, no compiler runs, and the analysis ends in
      # "No source code seen during build".
      - name: Build for CodeQL (traced build, cold cache)
        run: >
          ./gradlew :app:assembleDebug :shared:build
          --no-build-cache -Dorg.gradle.caching=false
          --stacktrace --no-daemon

      # Turns a silent "no source" analysis into an actionable failure: if the APK or any
      # compiled class is missing, compilation did not happen and the analysis is meaningless.
      - name: Confirm the traced build compiled sources
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          CLASSES=$(find app/build shared/build -name '*.class' -print -quit)
          if [ -z "$CLASSES" ]; then
            echo "::error::The traced build produced no compiled classes; CodeQL cannot analyze anything."
            exit 1
          fi
          echo "Compiled output present: $CLASSES"

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-app

  # ------------------------------------------- dependency graph (transitive CVEs)
  # Dependabot's Gradle ecosystem only reads the versions declared in the catalog; it cannot
  # see what those resolve to. Submitting the resolved graph is what makes a CVE in a
  # transitive artifact (OkHttp behind ktor, protobuf behind Firebase, ExoPlayer internals)
  # raise an alert instead of staying invisible.
  #
  # `contents: write` is scoped to this job, and the job never runs on pull_request, where a
  # fork's token is read-only and the submission would fail.
  dependency-submission:
    name: Submit Gradle dependency graph
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The resolve task configures every module, and an Android module fails configuration
      # (recording nothing) when the SDK is absent.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The Dependency Submission API answers "The Dependency graph is disabled for this
      # repository" when Settings → Code security → Dependency graph is off, and no workflow
      # permission can change that. So the graph is ALWAYS generated (real work, always
      # possible, uploaded as an artifact) and only SUBMITTED when an admin has enabled the
      # feature and opted in with the repository variable DEPENDENCY_GRAPH_ENABLED=true.
      - name: Generate the dependency graph snapshot
        if: vars.DEPENDENCY_GRAPH_ENABLED != 'true'
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-upload

      - name: Generate and submit the dependency graph
        if: vars.DEPENDENCY_GRAPH_ENABLED == 'true'
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-submit

      # Never let a skipped submission read as a passed scan.
      - name: Report dependency graph status
        if: always()
        env:
          SUBMIT_ENABLED: ${{ vars.DEPENDENCY_GRAPH_ENABLED }}
        run: |
          {
            echo "### Gradle dependency graph"
            echo
            if [ "$SUBMIT_ENABLED" = "true" ]; then
              echo "Generated and submitted to the repository dependency graph."
            else
              echo "Generated and uploaded as a workflow artifact — **not submitted**."
              echo
              echo "Submission is off because the repository variable \`DEPENDENCY_GRAPH_ENABLED\`"
              echo "is not \`true\`. Enable *Settings → Code security → Dependency graph*, then set"
              echo "that variable to \`true\`. Until then, transitive CVEs are not monitored by"
              echo "Dependabot — treat dependency-graph coverage as missing, not as passing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SUBMIT_ENABLED" != "true" ]; then
            echo "::warning::Dependency graph submission is disabled; the snapshot was generated but not submitted."
          fi

  # ------------------------------------------------------------ single report
  report:
    name: Merge security report
    needs: [ static-audit, codeql ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No continue-on-error: if the artifacts are missing the merged report cannot represent
      # this run, and saying so is more useful than producing an empty green report.
      - name: Download audit artifacts
        uses: actions/download-artifact@v8
        with:
          path: audit-download
          pattern: audit-*
          merge-multiple: true

      - name: Merge into one report
        run: >
          python3 .github/scripts/merge-audit-report.py
          --input audit-download
          --out audit-report/SECURITY_AUDIT.md
          --workflow .github/workflows/security.yml

      - name: Upload the merged report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-report
          path: audit-report/SECURITY_AUDIT.md
          if-no-files-found: warn
          retention-days: 30
