name: Maestro Android E2E

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.maestro/**'
      - '.github/workflows/maestro-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.maestro/**'
      - '.github/workflows/maestro-android.yml'

permissions:
  contents: read

# A newer PR commit supersedes an in-flight run; pushes to main run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maestro-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Playstore
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID }}
      NISAB_RATE_URL: ${{ vars.NISAB_RATE_URL || secrets.NISAB_RATE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM for fast emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify AI_PROXY_URL is configured
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || secrets.AI_PROXY_URL }}
        run: |
          set -euo pipefail
          test -n "$(printf '%s' "$AI_PROXY_URL" | tr -d '[:space:]')" || {
            echo "::error::AI_PROXY_URL is empty. Set it on the Playstore environment as a variable or secret."
            exit 1
          }

      - name: Decode Firebase config (if provided)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "Decoded app/google-services.json from GOOGLE_SERVICES_JSON."
          else
            echo "GOOGLE_SERVICES_JSON is empty; continuing without a Firebase config."
          fi

      - name: Build Debug APK
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || secrets.AI_PROXY_URL }}
        run: ./gradlew :app:assembleDebug

      - name: Install Maestro CLI
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 --retry 3 "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot Emulator & Run Maestro
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 60000
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 1; done'
            maestro test --format junit --output report.xml --test-output-dir maestro-output .maestro/; status=$?; adb logcat -d -t 500 > maestro-logcat.txt || true; exit $status

      - name: Dump logcat on failure
        if: failure()
        run: |
          set -euo pipefail
          if [ ! -s maestro-logcat.txt ]; then
            adb logcat -d -t 500 > maestro-logcat.txt || true
          fi

      - name: Upload Screenshots & Test Report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: maestro-results
          path: |
            report.xml
            maestro-output/
            maestro-output/**/*.png
            maestro-logcat.txt
          retention-days: 7
          if-no-files-found: warn
