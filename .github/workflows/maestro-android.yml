name: Maestro Android E2E

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.maestro/**'
      - '.github/workflows/maestro-android.yml'

permissions:
  contents: read

jobs:
  maestro-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Playstore
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      NISAB_RATE_URL: ${{ vars.NISAB_RATE_URL || secrets.NISAB_RATE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM for fast emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify AI_PROXY_URL is configured
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || secrets.AI_PROXY_URL }}
        run: |
          test -n "$(printf '%s' "$AI_PROXY_URL" | tr -d '[:space:]')" || {
            echo "::error::AI_PROXY_URL is empty. Set it on the Playstore environment as a variable or secret."
            exit 1
          }

      - name: Build Debug APK
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || secrets.AI_PROXY_URL }}
        run: ./gradlew :app:assembleDebug

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot Emulator & Run Maestro
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 60000
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            maestro test --format junit --output report.xml --test-output-dir maestro-output .maestro/

      - name: Upload Screenshots & Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            report.xml
            maestro-output/
            *.png
