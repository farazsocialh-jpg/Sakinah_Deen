name: Android CI

# One job only: build the debug APK and upload it.
#
# Everything else (unit tests, lint, emulator device audit, MobSF, release signing,
# iOS, Cloudflare Worker, workflow validation) has been removed on purpose. This
# workflow exists to produce a downloadable app-debug.apk quickly.
#
# Run it locally with the same command:
#   ./gradlew :app:assembleDebug --build-cache --parallel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight build for the same ref.
concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-debug-apk:
    name: Fast debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --build-cache --parallel

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
