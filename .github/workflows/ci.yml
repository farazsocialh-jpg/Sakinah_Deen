name: Android CI

# The Android side of the pipeline: the app, the shared KMP module and the device audit.
#
#   quality        build + unit tests + lint + R8 release check; the merge gate
#   apk-security   MobSF assessment of the release APK produced by `quality`
#   device         ONE emulator boot: instrumented tests, accessibility measurement, UI/UX monkey
#   report         merged AUDIT.md for this workflow
#   release        signed-APK verification (only when the signing secrets are configured)
#
# Responsibilities live in exactly one workflow:
#   security.yml   CodeQL, audit checklist, mobsfscan, Gitleaks, dependency graph
#   ios.yml        shared framework, iOS app, simulator UI tests
#   worker.yml     AI Scholar proxy: syntax, tests, Wrangler dry-run
#   release.yml    the only signed, publishable AAB/APK
#
# Path filters keep the 75-minute emulator off docs-, Worker- and iOS-only changes.
# Development process (branches, gates, release, audit triage): docs/development-sop.md.

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'google-services.json'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - '.github/audit-baseline.json'
  pull_request:
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'google-services.json'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - '.github/audit-baseline.json'
  workflow_dispatch:
    inputs:
      a11y_gate:
        description: 'Fail when the device accessibility audit reports violations'
        type: boolean
        default: false
      mobsf_gate:
        description: 'MobSF severity that fails the build'
        type: choice
        options: [high, medium, none]
        default: high

permissions:
  contents: read

# A newer PR commit supersedes the old run. Pushes to main and manual runs are never
# cancelled: the weekly security baseline and a release check must not be discarded by the
# next commit that lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MOBSF_API_KEY: ci-audit-key

jobs:
  # ------------------------------------------------- build, test, lint, R8 verify
  quality:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write   # upload the lint SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # One invocation instead of four daemon-less Gradle startups (~1.5 min per run).
      # `:shared:allTests` is named explicitly even though `:shared:build` reaches it through
      # `check`, so the shared tests stay a declared task; Gradle de-duplicates the work.
      - name: Build shared KMP module, debug APK and unit tests
        id: build
        run: >
          ./gradlew :shared:build :shared:allTests :app:assembleDebug :app:testDebugUnitTest
          --stacktrace --no-daemon

      # A green test task proves nothing if it ran no tests. This fails the build when the
      # unit-test tasks produced no results, so a broken source set cannot pass silently.
      - name: Verify unit tests actually ran
        if: steps.build.outcome == 'success'
        run: |
          python3 - <<'PY'
          import glob, sys
          import xml.etree.ElementTree as ET

          files = glob.glob("app/build/test-results/**/*.xml", recursive=True) + \
                  glob.glob("shared/build/test-results/**/*.xml", recursive=True)
          cases = failures = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              cases += len(list(root.iter("testcase")))
              failures += len(list(root.iter("failure"))) + len(list(root.iter("error")))
              skipped += len(list(root.iter("skipped")))
          print(f"{len(files)} result file(s), {cases} test(s), {failures} failure(s), {skipped} skipped")
          if cases == 0:
              print("::error::No unit tests ran (app and shared produced no test results).")
              sys.exit(1)
          if skipped:
              print(f"::warning::{skipped} unit test(s) were skipped.")
          sys.exit(1 if failures else 0)
          PY

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            app/build/test-results/**
            shared/build/test-results/**
            app/build/reports/tests/**
            shared/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

      # Official Android Lint: security, correctness, accessibility, i18n and performance.
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Convert Android Lint to SARIF
        if: always()
        run: |
          mkdir -p audit-report
          python3 .github/scripts/lint-to-sarif.py \
            app/build/reports/lint-results-debug.xml \
            --out audit-report/lint.sarif \
            --summary audit-report/lint.md

      - name: Upload Lint SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: audit-report/lint.sarif
          category: android-lint

      - name: Generate ephemeral release keystore for R8 verification
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=ImanCore CI" >/dev/null 2>&1
          test -s "$RUNNER_TEMP/ci-release.jks"

      # Also the APK that apk-security scans, so the release build happens once per run.
      - name: Verify release build (R8)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci-release.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: ci
          KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload release APK for the security scan
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-lint
          path: |
            audit-report/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------- APK analysis
  apk-security:
    name: APK security (MobSF)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the MobSF SARIF
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the release APK built by quality
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: apk

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0 platform-tools'

      - name: APK inventory (manifest, permissions, size)
        run: |
          mkdir -p audit-report
          APK=$(find apk -name '*.apk' | head -1)
          test -n "$APK"
          echo "Scanning $APK"
          {
            echo "### APK inventory"
            echo
            echo '```'
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" 2>/dev/null \
              | grep -E '^(package|sdkVersion|targetSdkVersion|uses-permission|application-label|native-code)' || true
            echo '```'
            echo
            echo "Size: $(du -h "$APK" | cut -f1)"
          } > audit-report/apk.md
          cat audit-report/apk.md

      - name: Start MobSF
        run: |
          docker run -d --name mobsf -p 8000:8000 \
            -e MOBSF_API_KEY="$MOBSF_API_KEY" \
            opensecurity/mobile-security-framework-mobsf:latest

      - name: MobSF APK scan
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          python3 .github/scripts/mobsf-scan.py \
            --apk "$APK" \
            --url http://localhost:8000 \
            --key "$MOBSF_API_KEY" \
            --out-dir audit-report \
            --gate "${{ inputs.mobsf_gate || 'high' }}"

      - name: Upload MobSF SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: audit-report/mobsf.sarif
          category: mobsf

      - name: Upload APK audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-apk
          path: audit-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop MobSF
        if: always()
        run: docker rm -f mobsf >/dev/null 2>&1 || true

  # ----------------------------------- ONE emulator: tests + accessibility + UI/UX
  device:
    name: Device (instrumented tests, a11y, UI/UX)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # No separate assembleDebug here: the device script builds the app and test APKs itself
      # so that a compilation failure is reported as one, before any emulator work.
      - name: Enable KVM group perms
        run: |
          # The attribute is OPTIONS (plural); a misspelt key makes udev drop the rule. The
          # explicit chmod covers runners where the trigger does not re-apply the mode to the
          # existing /dev/kvm node.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not accessible, so the emulator cannot be hardware accelerated."
            exit 1
          fi

      # One boot, staged (scripts/run-device-audit.sh): emulator readiness, compile, APK
      # presence, install, instrumented tests (gate), accessibility (report-only), UI/UX
      # monkey (gate on crash/ANR). Each stage reports its own failure.
      - name: Run the device legs
        id: device
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash .github/scripts/run-device-audit.sh

      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-device
          path: |
            device-report/
            a11y-report/
            uiux-report/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30

      # The step above is continue-on-error only so the reports always upload; failing tests or
      # an app crash still fail the job here. Accessibility findings do not reach this step.
      - name: Fail on failing tests or a crash/ANR
        if: steps.device.outcome == 'failure'
        run: |
          if [ -f device-report/failed-stages.txt ]; then
            echo "Failed stage(s): $(paste -sd, device-report/failed-stages.txt)"
          fi
          echo "::error::A device stage failed; see the audit-device artifact (device-report/status.md)."
          exit 1

      # Opt-in only: flip a11y_gate to true once the reported violations are confirmed.
      - name: Enforce the accessibility gate
        if: always() && inputs.a11y_gate
        run: |
          python3 - <<'PY'
          import glob, json, sys

          files = glob.glob("a11y-report/a11y.json")
          if not files:
              print("::warning::No accessibility report, so there is nothing to gate.")
              sys.exit(0)
          screens = json.load(open(files[0]))
          violations = sum(
              len(s.get("smallTargets", [])) + len(s.get("unlabelledClickables", []))
              for s in screens
          )
          if violations:
              print(f"::error::{violations} accessibility violation(s) confirmed and a11y_gate is enabled.")
              sys.exit(1)
          PY

  # ------------------------------------------------------------ single report
  report:
    name: Merge audit report
    needs: [ quality, apk-security, device ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download audit artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: audit-download
          pattern: audit-*
          merge-multiple: true

      - name: Merge into one report
        run: python3 .github/scripts/merge-audit-report.py --input audit-download --out audit-report/AUDIT.md

      - name: Upload the merged report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-audit-report
          path: audit-report/AUDIT.md
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------- release verification
  # (real signed APK verification; requires secrets not committed to repo)
  # Runs only when the signing secrets are configured; otherwise it is skipped so a
  # missing keystore does not turn a green CI run red (see docs/release-signing.md).
  release:
    name: Release APK (verification)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Job-level `if` cannot reference the `secrets` context, so the presence check runs
      # here and gates every subsequent step. The job stays green (steps skipped) when the
      # signing secrets are not configured (see docs/release-signing.md).
      - name: Check signing secrets
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name (see docs/release-signing.md)"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured; skipping release verification."
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.secrets.outputs.has_secrets == 'true'
        uses: actions/checkout@v7
      - name: Set up JDK 17
        if: steps.secrets.outputs.has_secrets == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        if: steps.secrets.outputs.has_secrets == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Make Gradle wrapper executable
        if: steps.secrets.outputs.has_secrets == 'true'
        run: chmod +x ./gradlew
      - name: Decode release keystore
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          test -s "$RUNNER_TEMP/release-keystore.jks"
      - name: Verify keystore
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -verify -keystore "$RUNNER_TEMP/release-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1
      - name: Build signed release APK
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Verify APK signature and signer identity
        if: steps.secrets.outputs.has_secrets == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          # Exits non-zero when the APK is unsigned or the signature is invalid.
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          # A valid signature is not enough: it must be the production key, not a debug or CI
          # key. Compare the signer certificate with the configured keystore entry.
          EXPECTED=$(keytool -list -v -keystore "$RUNNER_TEMP/release-keystore.jks" \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
            | awk -F': ' '/SHA256:/{print $2; exit}')
          ACTUAL=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' "$RUNNER_TEMP/apksigner.txt")
          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the signing certificate digest (expected='$EXPECTED' actual='$ACTUAL')."
            exit 1
          fi
          if [ "$(echo "$EXPECTED" | tr 'A-F' 'a-f' | tr -d ' ')" != "$(echo "$ACTUAL" | tr 'A-F' 'a-f' | tr -d ' ')" ]; then
            echo "::error::The release APK is not signed by the configured production key."
            exit 1
          fi
          echo "Signed by the configured production certificate."
      - name: Upload verified release APK
        if: steps.secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
