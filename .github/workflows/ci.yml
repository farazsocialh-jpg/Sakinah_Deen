name: CI

# The single pipeline for the Android app, its KMP shared code and the automated audit.
# One workflow, one trigger, one report — replacing the four overlapping workflows this repo
# used to run on every push (build, audit, UI/UX audit, signed release APK).
#
#   quality        build + unit tests + lint + R8 release check; the merge gate
#   static-audit   embedded audit checklist, mobsfscan (OWASP MASVS), Gitleaks
#   codeql         data-flow security analysis of Kotlin/Java
#   apk-security   MobSF assessment of the release APK produced by `quality`
#   device         ONE emulator boot: instrumented tests, accessibility measurement, UI/UX monkey
#   report         merged AUDIT.md for the run
#
# Release signing lives in release.yml (tag or manual). iOS lives in ios.yml.
# Development process (branches, gates, release, audit triage): docs/development-sop.md.

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'   # weekly drift check: new CVEs, new lint rules, new permissions
  workflow_dispatch:
    inputs:
      strict:
        description: 'Audit: fail on every known gap, not only on regressions'
        type: boolean
        default: false
      a11y_gate:
        description: 'Fail when the device accessibility audit reports violations'
        type: boolean
        default: false
      mobsf_gate:
        description: 'MobSF severity that fails the build'
        type: choice
        options: [high, medium, none]
        default: high

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MOBSF_API_KEY: ci-audit-key

jobs:
  # ------------------------------------------------- build, test, lint, R8 verify
  quality:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # One invocation instead of four daemon-less Gradle startups (~1.5 min per run).
      # `:shared:allTests` is named explicitly even though `:shared:build` reaches it through
      # `check`, so the shared tests stay a declared task; Gradle de-duplicates the work.
      - name: Build shared KMP module, debug APK and unit tests
        run: >
          ./gradlew :shared:build :shared:allTests :app:assembleDebug :app:testDebugUnitTest
          --stacktrace --no-daemon

      # Official Android Lint: security, correctness, accessibility, i18n and performance.
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Convert Android Lint to SARIF
        if: always()
        run: |
          mkdir -p audit-report
          python3 .github/scripts/lint-to-sarif.py \
            app/build/reports/lint-results-debug.xml \
            --out audit-report/lint.sarif \
            --summary audit-report/lint.md

      - name: Upload Lint SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: audit-report/lint.sarif
          category: android-lint

      - name: Generate ephemeral release keystore for R8 verification
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=ImanCore CI" >/dev/null 2>&1
          test -s "$RUNNER_TEMP/ci-release.jks"

      # Also the APK that apk-security scans, so the release build happens once per run.
      - name: Verify release build (R8)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci-release.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: ci
          KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload release APK for the security scan
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-lint
          path: |
            audit-report/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------- static audit (fast)
  static-audit:
    name: Audit checklist, mobsfscan, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the embedded audit checklist
        env:
          STRICT: ${{ inputs.strict && '--strict' || '' }}
        run: python3 .github/scripts/audit-checklist.py $STRICT

      - name: mobsfscan (OWASP mobile static analysis)
        run: |
          mkdir -p audit-report
          # An isolated venv avoids PEP 668 / system-site permission failures on runners.
          python3 -m venv "$RUNNER_TEMP/mobsfscan-venv"
          "$RUNNER_TEMP/mobsfscan-venv/bin/pip" install --quiet --disable-pip-version-check mobsfscan
          # Findings are reported through SARIF; the checklist decides what blocks a merge.
          "$RUNNER_TEMP/mobsfscan-venv/bin/mobsfscan" \
            --sarif -o audit-report/mobsfscan.sarif app/src shared/src || true
          python3 - <<'PY'
          import json, pathlib
          report = pathlib.Path("audit-report/mobsfscan.sarif")
          rows, counts = [], {}
          if report.is_file():
              data = json.loads(report.read_text())
              for run in data.get("runs", []):
                  for result in run.get("results", []):
                      rule = result.get("ruleId", "mobsfscan")
                      counts[rule] = counts.get(rule, 0) + 1
                      rows.append(f"| `{rule}` | {result.get('message', {}).get('text', '')[:160]} |")
          lines = ["### mobsfscan", "", f"{len(rows)} finding(s)", ""]
          if rows:
              lines += ["| Rule | Message |", "|---|---|"] + rows[:40]
          pathlib.Path("audit-report/mobsfscan.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Gitleaks (committed secrets)
        run: |
          mkdir -p audit-report
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --report-format=sarif --report-path=/repo/audit-report/gitleaks.sarif \
            --no-banner --redact --exit-code 0

      - name: Upload SARIF findings
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: audit-report
          category: static-audit

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-static
          path: audit-report/
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------------- CodeQL
  codeql:
    name: CodeQL (data-flow security analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The java-kotlin extractor needs the JDK present when it initializes, otherwise it can
      # start without instrumentation and the analysis then processes no Kotlin/Java code.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build for CodeQL
        run: ./gradlew :app:assembleDebug :shared:build --stacktrace --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-app

  # -------------------------------------------------------------- APK analysis
  apk-security:
    name: APK security (MobSF)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the release APK built by quality
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: apk

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 platform-tools'

      - name: APK inventory (manifest, permissions, size)
        run: |
          mkdir -p audit-report
          APK=$(find apk -name '*.apk' | head -1)
          test -n "$APK"
          echo "Scanning $APK"
          {
            echo "### APK inventory"
            echo
            echo '```'
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" 2>/dev/null \
              | grep -E '^(package|sdkVersion|targetSdkVersion|uses-permission|application-label|native-code)' || true
            echo '```'
            echo
            echo "Size: $(du -h "$APK" | cut -f1)"
          } > audit-report/apk.md
          cat audit-report/apk.md

      - name: Start MobSF
        run: |
          docker run -d --name mobsf -p 8000:8000 \
            -e MOBSF_API_KEY="$MOBSF_API_KEY" \
            opensecurity/mobile-security-framework-mobsf:latest

      - name: MobSF APK scan
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          python3 .github/scripts/mobsf-scan.py \
            --apk "$APK" \
            --url http://localhost:8000 \
            --key "$MOBSF_API_KEY" \
            --out-dir audit-report \
            --gate "${{ inputs.mobsf_gate || 'high' }}"

      - name: Upload MobSF SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: audit-report/mobsf.sarif
          category: mobsf

      - name: Upload APK audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-apk
          path: audit-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop MobSF
        if: always()
        run: docker rm -f mobsf >/dev/null 2>&1 || true

  # ----------------------------------- ONE emulator: tests + accessibility + UI/UX
  device:
    name: Device (instrumented tests, a11y, UI/UX)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # No separate assembleDebug here: connectedDebugAndroidTest builds the app and its test
      # APK itself, so a build step would just compile everything a second time.
      - name: Enable KVM group perms
        run: |
          # The attribute is OPTIONS (plural); a misspelt key makes udev drop the rule. The
          # explicit chmod covers runners where the trigger does not re-apply the mode to the
          # existing /dev/kvm node.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not accessible, so the emulator cannot be hardware accelerated."
            exit 1
          fi

      # One boot, three legs (scripts/run-device-audit.sh): instrumented tests gate the job,
      # the UI/UX monkey gates on crashes, the accessibility leg is report-only.
      - name: Run the device legs
        id: device
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash .github/scripts/run-device-audit.sh

      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-device
          path: |
            device-report/
            a11y-report/
            uiux-report/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30

      # The step is continue-on-error only so the reports above always upload; failing tests or
      # an app crash still fail the job here. Accessibility findings do not reach this step.
      - name: Fail on failing tests or a crash/ANR
        if: steps.device.outcome == 'failure'
        run: |
          echo "::error::A device leg failed (instrumented tests or an app crash/ANR); see the audit-device artifact."
          exit 1

      # Opt-in only: flip a11y_gate to true once the reported violations are confirmed.
      - name: Enforce the accessibility gate
        if: always() && inputs.a11y_gate
        run: |
          python3 - <<'PY'
          import glob, json, sys

          files = glob.glob("a11y-report/a11y.json")
          if not files:
              print("::warning::No accessibility report, so there is nothing to gate.")
              sys.exit(0)
          screens = json.load(open(files[0]))
          violations = sum(
              len(s.get("smallTargets", [])) + len(s.get("unlabelledClickables", []))
              for s in screens
          )
          if violations:
              print(f"::error::{violations} accessibility violation(s) confirmed and a11y_gate is enabled.")
              sys.exit(1)
          PY

  # ------------------------------------------------------------ single report
  report:
    name: Merge audit report
    needs: [ quality, static-audit, codeql, apk-security, device ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download audit artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: audit-download
          pattern: audit-*
          merge-multiple: true

      - name: Merge into one report
        run: python3 .github/scripts/merge-audit-report.py --input audit-download --out audit-report/AUDIT.md

      - name: Upload the merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-audit-report
          path: audit-report/AUDIT.md
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------- release verification
  # (real signed APK verification; requires secrets not committed to repo)
  release:
    name: Release APK (verification)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo ${{ secrets.KEYSTORE_BASE64 }} | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          keytool -verify -keystore "$RUNNER_TEMP/release-keystore.jks" \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -alias ${{ secrets.KEY_ALIAS }} >/dev/null 2>&1
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Verify APK signature
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: ci
          KEY_PASSWORD: android
        run: |
          apksigner verify --verbose \
            -certs app/build/outputs/apk/release/*.apk
      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
