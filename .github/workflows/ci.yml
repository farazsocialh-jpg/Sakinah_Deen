name: Android CI

# Two jobs:
#   1. build the debug APK and upload it (the installable app);
#   2. render the exhaustive UI matrix on the JVM (Robolectric + Roborazzi) and upload
#      every palette / mode / font / layout screenshot plus the HTML report.
#
# Run them locally with the same commands:
#   ./gradlew :app:assembleDebug --build-cache --parallel
#   ./gradlew :app:recordRoborazziDebug

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight build for the same ref.
concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-debug-apk:
    name: Fast debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playstore environment holds the Scholar proxy URL and Google client id. buildConfigField
    # bakes AI_PROXY_URL into this APK, so the debug build must see the same values as release.
    environment: Playstore
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      NISAB_RATE_URL: ${{ vars.NISAB_RATE_URL || secrets.NISAB_RATE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify AI_PROXY_URL is configured
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || secrets.AI_PROXY_URL }}
        run: |
          test -n "$(printf '%s' "$AI_PROXY_URL" | tr -d '[:space:]')" || {
            echo "::error::AI_PROXY_URL is empty. Set it on the Playstore environment as a variable or secret."
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || secrets.AI_PROXY_URL }}
        run: ./gradlew :app:assembleDebug --build-cache --parallel

      - name: Report debug signing SHA-1
        # The Google OAuth Android client is matched by package + signing SHA-1. CI signs
        # with its own debug key, which is not the same as a developer's ~/.android key.
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          echo '### Debug APK signing fingerprint' >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep 'SHA-1 digest' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  ui-snapshot-matrix:
    name: Exhaustive UI snapshot matrix
    runs-on: ubuntu-latest
    environment: Playstore
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      NISAB_RATE_URL: ${{ vars.NISAB_RATE_URL || secrets.NISAB_RATE_URL }}
    # ~300 PNGs (17 palettes x 2 modes x every screen, 4 font presets, 19 layouts,
    # 15 secondary screens) render in a few minutes; the margin covers a cold Gradle cache.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify AI_PROXY_URL is configured
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || secrets.AI_PROXY_URL }}
        run: |
          test -n "$(printf '%s' "$AI_PROXY_URL" | tr -d '[:space:]')" || {
            echo "::error::AI_PROXY_URL is empty. Set it on the Playstore environment as a variable or secret."
            exit 1
          }

      - name: Record every screen in every theme/font/layout
        # --no-configuration-cache: Roborazzi injects per-task system properties, which
        # configuration-cache snapshots would otherwise keep from the first invocation.
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || secrets.AI_PROXY_URL }}
        run: ./gradlew :app:recordRoborazziDebug --no-configuration-cache --stacktrace

      - name: Upload snapshot matrix PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshot-matrix
          path: |
            app/build/outputs/roborazzi
            app/build/reports/tests
            app/build/reports/roborazzi
          retention-days: 14
          if-no-files-found: warn
