name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build shared KMP module
        run: ./gradlew :shared:build --stacktrace --no-daemon

      - name: Run shared KMP tests
        run: ./gradlew :shared:allTests --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Generate ephemeral release keystore for R8 verification
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=Sakinah CI" >/dev/null 2>&1
          test -s "$RUNNER_TEMP/ci-release.jks"

      - name: Verify release build (R8)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci-release.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: ci
          KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sakinah-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
