name: AI Human QA (Arbigent)

# Manual only: every run spends Gemini API credits.
# Requires GEMINI_API_KEY, either as a repository secret/variable or as one
# scoped to the "Playstore" environment (Settings -> Secrets and variables ->
# Actions). The job stops with a clear error before booting an emulator if it
# cannot find a non-empty value.

on:
  workflow_dispatch:
    inputs:
      gemini_model:
        description: "Gemini model id (free tier: 3.5-flash-lite = 15 req/min, 500/day)"
        required: false
        default: gemini-3.5-flash-lite
        type: string

permissions:
  contents: read

jobs:
  ai-ux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GEMINI_API_KEY is stored on the "Playstore" environment, and environment
    # scoped values are only injected into jobs that name the environment.
    environment: Playstore
    env:
      # The wrapper needs a pinned release: no arbigentw.properties ships with the
      # app repo, so it bootstraps one from this version on first run.
      ARBIGENT_VERSION: "0.89.0"
      # Overridable from the Run workflow form, so a renamed/deprecated model
      # does not need a code change. 2.5-flash returns 404 for new API keys.
      #
      # Free-tier quotas decide the default: gemini-3.8-flash allows only 5
      # requests/minute and 20/day, which a multi-step audit exhausts at once
      # (429 RESOURCE_EXHAUSTED, generate_content_free_tier_requests).
      # gemini-3.5-flash-lite is free too, accepts screenshots, and allows
      # roughly 15 requests/minute and 500/day.
      GEMINI_MODEL: ${{ inputs.gemini_model || 'gemini-3.5-flash-lite' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM for fast emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Download Arbigent Wrapper
        run: |
          curl -fsSLo arbigentw https://raw.githubusercontent.com/takahirom/arbigent/main/arbigent-cli/src/main/resources/arbigentw
          chmod +x arbigentw
          # Pins arbigentw.properties and downloads/verifies the CLI before the
          # emulator starts, so setup failures are not hidden inside the run step.
          ./arbigentw --help > /dev/null

      - name: Write Arbigent Gemini settings
        env:
          # Either source works: an environment/repository secret, or an
          # environment/repository variable (the Variables tab uses vars.*).
          GEMINI_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY_VARIABLE: ${{ vars.GEMINI_API_KEY }}
        run: |
          # Unset values expand to an empty string, which Arbigent reports as
          # "Missing Gemini API key". Fail here instead, before the emulator boots.
          GEMINI_API_KEY="${GEMINI_KEY_SECRET:-}"
          if [ -z "$GEMINI_API_KEY" ]; then
            GEMINI_API_KEY="${GEMINI_KEY_VARIABLE:-}"
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::No GEMINI_API_KEY for environment 'Playstore'. Add it under Settings -> Secrets and variables -> Actions (Secrets or Variables, name GEMINI_API_KEY, environment Playstore)."
            exit 1
          fi
          echo "::add-mask::$GEMINI_API_KEY"
          # Settings keys are the CLI's long flags minus "--" (gemini-api-key, not
          # gemini.apikey). Written to the gitignored local settings file so the key
          # never reaches the repository, a commit, or the uploaded artifact.
          umask 077
          printf 'ai-type: gemini\ngemini-model-name: %s\ngemini-api-key: "%s"\n' "$GEMINI_MODEL" "$GEMINI_API_KEY" \
            > .arbigent/settings.local.yml

      - name: Boot Emulator & Run AI UX Agent
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            ./arbigentw run --os=android --project-file=.arbigent/imancore_ux_audit.yaml --ai-type=gemini --gemini-model-name="$GEMINI_MODEL"

      - name: Upload AI QA Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbigent-ux-report
          path: arbigent-result/

      - name: Remove Arbigent settings (contains the API key)
        if: always()
        run: rm -f .arbigent/settings.local.yml
