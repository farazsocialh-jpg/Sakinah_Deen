name: AI Human QA (Arbigent)

# Manual only: every run spends free-tier AI quota.
#
# Providers are tried cheapest-first. Each tier is skipped cheaply when its key
# is absent or its pre-flight probe fails:
#   1. groq       Groq          (GROQ_API_KEY)
#   2. gemini     Google Gemini (GEMINI_API_KEY)
#   3. openrouter OpenRouter    (OPENROUTER_API_KEY)
#   4. github     GitHub Models (opt-in via ENABLE_GITHUB_MODELS=true)
#
# GitHub Models was retired on 2026-07-30, so tier 4 is off by default: the
# always-present GITHUB_TOKEN must not be mistaken for a usable provider key.
# Only a provider/quota error (never a UI assertion failure) falls through to
# the next provider for the scenarios that did not finish.
#
# The whole shell program lives in .github/scripts/run-arbigent.sh because
# android-emulator-runner splits a multi-line `script:` input into separate
# `sh -c` invocations; variables, functions and loops cannot span those lines.

on:
  workflow_dispatch:
    inputs:
      gemini_model:
        description: "Gemini model id (free tier: 3.5-flash-lite = 15 req/min, 500/day)"
        required: false
        default: gemini-3.5-flash-lite
        type: string
      scenario_ids:
        description: "Optional comma-separated scenario ids to run (e.g. 04-qibla-compass-sun-and-map,08a-wealth-and-guide). Empty runs all."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  # Only needed when ENABLE_GITHUB_MODELS is explicitly turned back on.
  models: read

jobs:
  ai-ux-test:
    runs-on: ubuntu-latest
    # Eleven INDEPENDENT scenarios (each with its own CleanupData + LaunchApp) drive the
    # real APK: roughly 180 AI steps across 11 scenarios/assertions. The budget also covers
    # a cold emulator boot, the APK install, WebView map tiles in the Qibla scenario, and a
    # fallback provider re-running whatever a quota-limited provider could not finish.
    timeout-minutes: 75
    # GEMINI_API_KEY is stored on the "Playstore" environment, and environment
    # scoped values are only injected into jobs that name the environment.
    environment: Playstore
    env:
      # The wrapper and its SHA-256 pin are checked in. No download from a
      # moving branch, and no silent bootstrap of a different release.
      ARBIGENT_VERSION: "0.89.0"
      # Set the repository/environment variable to 'true' only if GitHub
      # Models is restored; the default GITHUB_TOKEN is not a usable tier.
      ENABLE_GITHUB_MODELS: "${{ vars.ENABLE_GITHUB_MODELS == 'true' }}"
      # Overridable from the Run workflow form, so a renamed/deprecated model
      # does not need a code change.
      #
      # Free-tier quotas decide the default: gemini-2.5-flash returns 404 for new
      # API keys, and gemini-3.8-flash allows only 5 requests/minute and 20/day,
      # which a multi-step audit exhausts at once (429 RESOURCE_EXHAUSTED,
      # generate_content_free_tier_requests). gemini-3.5-flash-lite is free too,
      # accepts screenshots, and allows roughly 15 requests/minute and 500/day.
      GEMINI_MODEL: ${{ inputs.gemini_model || 'gemini-3.5-flash-lite' }}
      # Vision models, one per free tier. All four speak the OpenAI chat-completions
      # schema, so they run through Arbigent's `--ai-type=openai` provider with a
      # custom `--openai-endpoint`. Model ids are env vars so a catalogue rename is
      # a one-line change here rather than a rewrite of the run script.
      GITHUB_MODEL: "openai/gpt-4o-mini"
      GROQ_MODEL: "meta-llama/llama-4-scout-17b-16e-instruct"
      # OpenRouter rotates its individual ":free" vision ids constantly; the
      # auto-router only ever falls back to another free model, which keeps the
      # tier at $0 instead of silently billing a paid model.
      OPENROUTER_MODEL: "openrouter/free"
      # Comma-separated scenario ids from the Run workflow form ("" = every scenario).
      ARBIGENT_SCENARIO_IDS: ${{ inputs.scenario_ids }}
      # Maestro (Arbigent's device driver) boots its instrumentation driver per scenario.
      # Eleven scenarios need more than the 60 s default to avoid startup flakiness.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM for fast emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Arbigent Wrapper
        run: |
          chmod +x arbigentw .github/scripts/run-arbigent.sh
          pinned=$(sed -n 's/^distributionVersion=//p' arbigentw.properties)
          [ "$pinned" = "$ARBIGENT_VERSION" ] || {
            echo "::error::arbigentw.properties pins $pinned but ARBIGENT_VERSION is $ARBIGENT_VERSION. Update both deliberately."
            exit 1
          }
          # Downloads/verifies the pinned CLI before the emulator starts, so
          # setup failures are not hidden inside the QA run step.
          ./arbigentw --help > /dev/null

      - name: Verify at least one AI provider is configured
        env:
          GITHUB_TOKEN_FOR_MODELS: ${{ secrets.GITHUB_TOKEN }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY_VARIABLE: ${{ vars.GEMINI_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Unset values expand to an empty string. Fail here, before the
          # emulator boots, instead of burning 15 minutes to reach this later.
          available=""
          gemini_key="${GEMINI_KEY_SECRET:-${GEMINI_KEY_VARIABLE:-}}"
          for pair in "groq:${GROQ_KEY:-}" "gemini:${gemini_key}" \
                      "openrouter:${OPENROUTER_KEY:-}"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -n "$value" ]; then
              available="$available $name"
              echo "::add-mask::$value"
            fi
          done
          if [ "${ENABLE_GITHUB_MODELS:-false}" = "true" ] && [ -n "${GITHUB_TOKEN_FOR_MODELS:-}" ]; then
            available="$available github"
            echo "::add-mask::$GITHUB_TOKEN_FOR_MODELS"
          fi
          if [ -z "$available" ]; then
            echo "::error::No AI provider secret found. Add GROQ_API_KEY, GEMINI_API_KEY or OPENROUTER_API_KEY under Settings -> Secrets and variables -> Actions (environment 'Playstore' or repository level). GITHUB_TOKEN is not counted because GitHub Models was retired; set ENABLE_GITHUB_MODELS=true only if the service is restored."
            exit 1
          fi
          echo "AI provider tiers with a usable key:$available"
          # A leftover settings file from an older revision would override the
          # per-provider flags below, including a stale model or key.
          rm -f .arbigent/settings.local.yml
          rm -rf arbigent-result

      # Cheap checks first: a missing key or a broken pin must not burn a
      # four-minute APK build before failing.
      - name: Verify AI_PROXY_URL for APK build
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || secrets.AI_PROXY_URL }}
        run: |
          test -n "$(printf '%s' "$AI_PROXY_URL" | tr -d '[:space:]')" || {
            echo "::error::AI_PROXY_URL is empty. Set it on the Playstore environment as a variable or secret."
            exit 1
          }

      - name: Decode Firebase config (if provided)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "Decoded app/google-services.json from GOOGLE_SERVICES_JSON."
          else
            echo "GOOGLE_SERVICES_JSON is empty; continuing without a Firebase config."
          fi

      - name: Build Debug APK
        env:
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL || secrets.AI_PROXY_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID }}
          NISAB_RATE_URL: ${{ vars.NISAB_RATE_URL || secrets.NISAB_RATE_URL }}
        run: ./gradlew :app:assembleDebug

      - name: Boot Emulator & Run AI UX Agent
        id: ai_ux
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          # Opt-in tier; ignored unless ENABLE_GITHUB_MODELS is true.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Secrets or Variables both work, as in the check step above.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # KVM is enabled in the step above; a cold boot with Snapshots off is still slow.
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # One line on purpose: the action would otherwise execute every line
          # of the shell program in its own `sh -c` and lose all state.
          script: sh .github/scripts/run-arbigent.sh

      - name: Upload AI QA Report & Screenshots
        id: upload_report
        if: ${{ always() && !cancelled() && steps.ai_ux.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: arbigent-ux-report
          path: |
            arbigent-result/
            arbigent-run.log
          retention-days: 14
          # A QA run without a report is a broken run, not a warning.
          if-no-files-found: error

      - name: Remove Arbigent settings (contains the API key)
        if: always()
        run: rm -f .arbigent/settings.local.yml arbigent-probe.json arbigent-exit-code arbigent-attempt.log
