name: "Automated UI/UX Audit"

# Boots an Android emulator, installs the debug APK and lets Android's own monkey explore it
# (no hand-written tests, no model credentials). The run uploads screenshots, logcat and a
# Markdown summary as the `uiux-audit-report` artifact and fails if the app crashed or ANR'd.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: uiux-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Explore app and report UI/UX issues
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      # Without KVM the x86_64 emulator falls back to -accel off and never boots (or never
      # registers with adb) inside the timeout.
      - name: Enable KVM group perms
        run: |
          # The attribute is OPTIONS (plural); a misspelt key makes udev drop the rule. The
          # explicit chmod covers runners where the trigger does not re-apply the mode to the
          # existing /dev/kvm node.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm || true
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not accessible, so the emulator cannot be hardware accelerated."
            exit 1
          fi

      - name: Explore app and write the UI/UX report
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # The action runs each line of this input as its own `sh -c`, so the logic lives in a
          # script file rather than inline.
          script: bash .github/scripts/run-uiux-audit.sh

      - name: Upload UI/UX report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-audit-report
          path: uiux-report/
          if-no-files-found: warn
          retention-days: 30
