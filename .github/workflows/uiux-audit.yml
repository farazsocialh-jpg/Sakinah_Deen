name: "Automated UI/UX Audit"

# Boots an Android emulator, installs the debug APK and lets QAosMonkey explore the app on its
# own (no hand-written tests). The run produces a Markdown report plus screenshots, uploaded as
# the `uiux-audit-report` artifact. Requires the OPENAI_API_KEY repository secret; without it the
# workflow still goes green and prints a notice, so pushes are never blocked by a missing key.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: uiux-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Explore app and report UI/UX issues
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install audit tooling
        run: npm ci

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Explore app and write the UI/UX report
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            if [ -z "${OPENAI_API_KEY:-}" ]; then
              echo "::notice::OPENAI_API_KEY is not set, so the exploratory audit was skipped. Add the secret to enable it."
              exit 0
            fi

            # stdin is closed so a human-in-the-loop prompt cannot hang the emulator step.
            npx qaosmonkey run --config qaos-monkey.config.ts < /dev/null

      - name: Upload UI/UX report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-audit-report
          path: |
            .qaos-monkey/runs/
            qaos-monkey-report/
            uiux-report/
          if-no-files-found: warn
          retention-days: 30
