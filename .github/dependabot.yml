version: 2
updates:
  # Android/Kotlin dependency CVEs are the highest-value dependency signal for this app.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"

  # One PR for every action bump. Ungrouped, each refreshed action opened its own PR and
  # queued a full workflow run per branch; grouping keeps at most one action PR in flight.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    labels:
      - dependencies
      - worker
