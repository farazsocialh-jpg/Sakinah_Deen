# XcodeGen spec for the ImanCore iOS app.
#
# The Xcode project is generated, not committed, so the target, build settings and test
# targets live in reviewable YAML:
#
#   brew install xcodegen
#   cd ios && xcodegen generate      # writes ios/Sakinah.xcodeproj
#   open Sakinah.xcodeproj
#
# CI (.github/workflows/ios.yml) generates the project, builds the shared Kotlin framework and
# runs the SakinahUITests target on a simulator.
name: Sakinah

options:
  bundleIdPrefix: com.imancore
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Xcode's user-script sandbox blocks the Gradle build phase that produces the shared
    # Kotlin framework, so it must stay off for this project.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Sakinah:
    type: application
    platform: iOS
    sources:
      - path: Sakinah
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imancore.app
        PRODUCT_NAME: ImanCore
        INFOPLIST_FILE: Sakinah/Info.plist
        # Location of the framework produced by :shared:embedAndSignAppleFrameworkForXcode.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  SakinahUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SakinahUITests
    dependencies:
      - target: Sakinah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imancore.app.uitests
        TEST_TARGET_NAME: Sakinah
        # Xcode generates the test bundle's Info.plist; no checked-in copy is needed.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sakinah:
    build:
      targets:
        Sakinah: all
        SakinahUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SakinahUITests
