# Deep, screen-by-screen UI/UX audit for ImanCore (Sakinah Deen).
#
# Rules this file follows:
#  * Every scenario is INDEPENDENT: CleanupData + LaunchApp, no `dependency:` chain. One
#    broken screen can therefore never stop the remaining scenarios from running.
#  * Arbigent only evaluates `imageAssertions` on the FINAL screenshot of a scenario, so
#    each scenario ends on the exact screen its assertions grade.
#  * Android runtime permission dialogs are handled inside the goal text: they are denied
#    when the scenario tests the ungranted state, and accepted only where a screen needs it.
#
# Package note: the applicationId is com.imancore.app. "com.sakinah.deen" is only the Kotlin
# namespace, so launching that id would never open the app.
#
# Run with:
#   arbigentw run --os=android --project-file=.arbigent/imancore_ux_audit.yaml \
#     --ai-type=gemini --gemini-model-name=gemini-3.5-flash-lite
settings:
  variables:
    appId: "com.imancore.app"
  # Default is 3 retries per scenario. Eleven scenarios on a 500-request/day free tier must
  # not spend 4x on one flaky screen.
  maxRetry: 1
  prompt:
    appUiStructure: |-
      ImanCore is an Islamic companion app for Android.
      First launch shows a 4-step onboarding: Welcome (preferred name), About you
      (experience level + focus), Appearance (System/Light/Dark, colour palette swatches,
      font sizes, LIVE PREVIEW card), Permissions (Location, Notifications, Exact Alarms,
      Battery), then "Open ImanCore". "Skip" is available on the welcome step.
      Bottom navigation: Salah, Quran, Hadith, Scholar, Tools.
      Salah opens on a "Times" tab: header with Hijri date/location, "Today: X/Y Prayed"
      progress strip, prayer rows (Fajr, Dhuhr, Asr, Maghrib, Isha) with completion
      circles, and tabs "Times" / "Qibla". Qibla has Compass, Sun and Map modes.
      Quran: surah list -> reader with bookmark icons, reading-mode pills
      ("Verse by verse", "Mushaf page") and a bottom pill bar with Layout controls.
      Hadith: Books / Daily / Search / Saved tabs, collection cards with an "Open" button.
      Scholar: AI chat with quick prompts and an input bar above the bottom navigation.
      Tools: an account card, then the sections "ISLAMIC TOOLS" (Visual Salah Posture
      Guide, Zakat & Sadaqah Jar), "DISCOVER" (Replay Quick Tour, What's New, Offline
      Capabilities), "SETTINGS" (Prayer & Location, Prayer Notifications, Appearance &
      Reading, Quran & Offline Packs) and "SUPPORT & ABOUT" (Help & Feedback, Islamic
      Data Sources, Privacy & Terms, About ImanCore). There is NO Tasbih tile and NO
      Travel tile on this hub: travel settings live under Tools -> Prayer & Location, in
      its "Travel & Car" section, and Qadha opens from the "Qadha" pill in the Salah
      header. Do not look for a screen that is not listed here.
      Salah header: on the left the Hijri date and the "date · city ▾ · method" line, on the
      right the "Qadha" pill, a bell, a refresh and a tune/settings icon. Under the header a
      single compact amber card holds any location/exact-alarm warnings. Prayer rows show a
      filled check for a prayed prayer and a clock ring for the current, still-unprayed prayer.
    additionalSystemPrompts:
      - |-
        You are also a senior mobile UX reviewer. Before each action, add a short review
        of the current screen to your reply with these four labels, one line each:
        CLUTTER: how many elements compete with the main action.
        LAYOUT: alignment, spacing, clipping, overlap, content pushed off-screen.
        VISIBILITY: contrast, text size, unreadable or invisible labels.
        THEME: whether colours and typography look like a deliberate, modern Islamic app
        theme rather than Android's default Material look.
        Be specific and name the element you judge. Keep completing the goal.

scenarios:
  # ------------------------------------------------------------ onboarding
  - id: "01-onboarding-full-and-monochrome-contrast"
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      You are a first-time user on ImanCore's welcome step.
      0. If any Android system permission dialog appears, dismiss it ("Don't allow") and
         return to ImanCore.
      1. Tap the "Preferred name (optional)" field, type "Faraz", clear it completely,
         re-type "Faraz", dismiss the on-screen keyboard, then tap "Continue".
      2. On step 2, verify the greeting contains "Faraz". Tap each journey chip
         ("New to Islam", "Student of Knowledge", "Practicing Muslim"), then tap two
         different focus cards (for example "Reading Quran" and "Prayer consistency"),
         and tap "Continue".
      3. On the Appearance step, verify the LIVE PREVIEW Arabic and English text is
         visible. Tap "Dark". Select the "Black & White" (monochrome) palette. Scroll down
         inside the step to reveal the font controls, tap "Large" overall font size, tap
         "+" on Arabic Size and on Translation Size, and verify LIVE PREVIEW stays readable.
         Then tap "Continue".
      4. On step 4, verify the heading reads "Set up once, Faraz" (the name must not be
         missing). Inspect all four tiles - Location, Notifications, Exact Alarms, Battery.
         Do NOT tap "Open ImanCore". Stay on this screen.
    maxStep: 22
    imageAssertions:
      - assertionPrompt: "Step 4 displays 'Set up once, Faraz' and all 4 permission tiles and buttons (Allow/Allowed) have clear, high-contrast readable text with no blank white pills."

  # ------------------------------------------- skip + replay onboarding cancel
  - id: "02-onboarding-skip-and-replay-cancel"
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      0. Dismiss any Android permission dialog.
      1. Tap "Skip" on the welcome step and confirm the app lands cleanly on the main
         Salah screen, with the bottom navigation visible and no half-finished overlay.
      2. Tap "Tools" in the bottom navigation, then open "Settings" / "Appearance &
         Reading", then tap "Replay Quick Tour" (Replay Onboarding).
      3. Verify the onboarding wizard opens. Then dismiss it with the Close (X) or
         "Cancel" control. Verify you are returned to the Settings screen and can still
         scroll and tap controls (no frozen overlay, no broken back stack).
    maxStep: 16
    imageAssertions:
      - assertionPrompt: "Cancelling Replay Onboarding returns cleanly to the Settings screen with no frozen overlay or broken back stack."

  # ------------------------------------------------------------- salah
  - id: "03-salah-taps-progress-and-visual-guide"
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      0. Dismiss any Android permission dialog. Tap "Skip" if onboarding appears.
      1. On the Salah "Times" view, inspect the top header: the Hijri date line, the city
         and calculation-method line, the "Qadha" pill and the icon buttons. Check for
         truncated or ellipsised text.
      2. Tap Fajr's completion circle and verify the progress reads "Today: 1/5 Prayed"
         (20%). Tap Dhuhr and verify "2/5 Prayed" (40%). Tap Fajr again to unmark it and
         verify it returns to "1/5 Prayed".
      3. Expand one prayer row to inspect its details (time, rakat count, any warning).
      4. Open the Visual Salah Guide (from a prayer row's guide button, or Tools ->
         "Visual Salah Posture Guide"), tap through two or three steps, then return to the
         Salah "Times" screen and stay there.
    maxStep: 20
    imageAssertions:
      - assertionPrompt: "Salah rows, times, progress strip, and status icons are clearly legible with no overlapping text, ambiguous icons, or cramped labels."

  # ------------------------------------------------------------- qibla
  - id: "04-qibla-compass-sun-and-map"
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      0. Dismiss any Android permission dialog. Tap "Skip" if onboarding appears.
      1. Tap the "Qibla" tab on the Salah screen.
      2. In "Compass", check the degree readout, the location line and the status badge
         (for example "Magnet-Free") for readable contrast.
      3. Tap "Sun" and confirm it shows content, not a blank area or endless spinner.
      4. Tap "Map", wait 3 seconds without tapping again, and finish there.
    maxStep: 10
    imageAssertions:
      - assertionPrompt: "Qibla Map mode renders visible map tiles or graphics (NOT a blank solid-color rectangle) and all badges including Magnet-Free have readable contrast."

  # ------------------------------------------------------------- quran
  - id: "05-quran-search-layouts-modes-and-persistence"
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      0. Dismiss any Android permission dialog. Tap "Skip" if onboarding appears.
      1. Open the "Quran" tab. Type "Kahf" into the surah search bar, verify "Al-Kahf"
         appears in the results, then clear the search.
      2. Open "Al-Fatihah".
      3. Bookmark ayah 1 using the bookmark icon and confirm the icon visibly changes state.
      4. Tap the bottom pill bar "Layout" and the "Reading Mode" controls to cycle through
         the reading layouts and modes. Verify Arabic script, word-by-word meanings and
         translations stay aligned and readable in each.
      5. Scroll down to show several verses. Leave the Quran reader on a scrolled position
         that shows the bookmarked ayah and the bottom controls.
         (Note: Arbigent runs initialization methods once per scenario, so cross-relaunch
         persistence is exercised by the instrumented suite, not by a process kill here;
         verify instead that the bookmark and scroll position survive leaving and returning
         to the Quran tab.)
    maxStep: 20
    imageAssertions:
      - assertionPrompt: "Quran Arabic text, transliteration, translation, and bottom bar controls are well-spaced, readable, and free of overlap."

  # ------------------------------------------------------------- hadith
  - id: "06-hadith-books-detail-search-and-saved"
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      0. Dismiss any Android permission dialog. Tap "Skip" if onboarding appears.
      1. Open the "Hadith" tab and verify the "Books" tab loads collections such as
         "Sahih al-Bukhari" and "Sahih Muslim".
      2. Tap "Open" on "Sahih al-Bukhari", open a chapter and a hadith, verify the Arabic
         and its translation are both readable, and bookmark that hadith.
      3. Go back to the Hadith root. Open the "Daily" tab. Then open the "Search" tab,
         type "prayer" and verify matching results appear; replace it with "zzzzqqq" and
         verify a clean empty state (not a crash or a blank screen).
      4. Open the "Saved" tab and confirm the bookmarked hadith appears. Stay there.
    maxStep: 20
    imageAssertions:
      - assertionPrompt: "Hadith screens display legible content, clean cards, and proper empty/saved states."

  # ------------------------------------------------------------- scholar
  - id: "07-ai-scholar-input-keyboard-and-response"
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      0. Dismiss any Android permission dialog. Tap "Skip" if onboarding appears.
      1. Open the "Scholar" tab (AI chat).
      2. Tap a suggested prompt chip once, or tap the message input field and type
         "What are the conditions of Wudu?". While the keyboard is open, verify the Send
         button and the input bar are not hidden behind the keyboard.
      3. Tap Send and wait up to 10 seconds. Accept either a streaming response or a clear
         offline / not-configured error card; a silent blank screen is a failure.
      4. Leave the keyboard dismissed and stay on the Scholar screen with the conversation
         visible.
    maxStep: 14
    imageAssertions:
      - assertionPrompt: "AI Scholar chat input, send button, and message bubbles are unobstructed and clearly readable."

  # ------------------------------------------------------------- tools
  - id: "08a-wealth-and-guide"
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      0. Dismiss any Android permission dialog. Tap "Skip" if onboarding appears.
      1. Open "Tools" and find the "ISLAMIC TOOLS" section.
      2. Tap "Zakat & Sadaqah Jar". Type "10000" into the "Cash in Hand & Bank Accounts"
         field and check the Zakat payable summary updates without clipping or crashing.
         Go back to Tools.
      3. Tap "Visual Salah Posture Guide", step through two postures, then go back to
         Tools. Stay on the Tools hub.
    maxStep: 14
    imageAssertions:
      - assertionPrompt: "The Tools hub renders clean sections and readable tile titles/subtitles with no clipped or overlapping text."

  # ---------------------------------------------- travel settings + qadha ledger
  - id: "08b-travel-and-qadha"
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      0. Dismiss any Android permission dialog. Tap "Skip" if onboarding appears.
      1. Open "Tools" and tap "Prayer & Location" under the "SETTINGS" section.
      2. Scroll to the "Travel & Car" section, toggle "Travel Mode" once, and check the
         "Dua al-Safar" row renders. Go back.
      3. Open the "Salah" tab and tap the "Qadha" pill in the header. Check the Qadha
         ledger rows and its increment/decrement buttons, then leave the dialog open.
    maxStep: 18
    imageAssertions:
      - assertionPrompt: "The Qadha ledger dialog shows readable prayer rows with visible increment/decrement and confirm controls, with no clipped or overlapping text."

  # ------------------------------------------------------- settings/profile
  - id: "09-settings-notifications-and-profile"
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      0. Dismiss any Android permission dialog. Tap "Skip" if onboarding appears.
      1. Open "Tools" -> "Settings" (Appearance & Reading). Switch the palette to
         "Madinah Sand" and verify the change applies immediately with readable contrast.
      2. Open Notification Settings (from the Salah header bell or Settings) and toggle
         one notification preference; verify it responds without a crash.
      3. Open the Profile screen (if available) and edit the display name if it is
         editable; verify the change is reflected.
      4. Open "About ImanCore" / the info screens and verify they render. Finish on the
         Notification Settings screen.
    maxStep: 22
    imageAssertions:
      - assertionPrompt: "Settings, Notification Settings, and Profile screens render cleanly in the selected theme with clear contrast."

  # ------------------------------------------------- large font light stress
  - id: "10-large-font-light-mode-stress-test"
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      0. Dismiss any Android permission dialog.
      1. Complete onboarding: keep or enter a name, tap "Continue" on the journey step,
         then on the Appearance step select "Light" mode and "Emerald Sanctuary" (or
         "Madinah Sand"), set the overall font size to "Large", and tap "Continue".
         On the permissions step tap "Open ImanCore".
      2. Visit "Salah" and inspect prayer names, times and the progress strip for clipped
         or wrapping text.
      3. Visit "Quran" and inspect the reader header and bottom controls.
      4. Visit "Hadith" and inspect the tab labels and collection cards.
      5. Visit "Tools" and inspect the tile labels and their supporting text. Finish on
         the Tools hub.
    maxStep: 24
    imageAssertions:
      - assertionPrompt: "At Large font size in Light mode, all titles, prayer rows, buttons, and bottom navigation labels remain readable without clipping or overlap."
