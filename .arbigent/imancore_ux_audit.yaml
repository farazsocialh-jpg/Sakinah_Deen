# Deep, screen-by-screen UI/UX audit for ImanCore (Sakinah Deen).
#
# Why this file is shaped this way: Arbigent only evaluates `imageAssertions` on the
# FINAL screenshot of a scenario. The previous run packed whole journeys into one
# scenario, so defects on the screens in between were never graded - the blank Qibla
# Map mode, the low-contrast "Magnet-Free" badge, the truncated Salah header, the
# ambiguous orange checkmark on Dhuhr and the missing "Faraz" name on onboarding step 4
# all slipped through. Each scenario below therefore ENDS on the screen it grades, and
# dependencies chain them so one app session walks onboarding -> Salah -> Qibla ->
# Quran -> Hadith -> Scholar/Tools.
#
# Every assertion is written as a statement the image-assertion model has to agree
# with (>=80% confidence to pass). A FAILING assertion is the deliverable: the model
# writes why it disagreed, naming the element, into result.yml and report.html.
#
# Package note: the applicationId is com.imancore.app. "com.sakinah.deen" is only the
# Kotlin namespace, so launching that id would never open the app.
#
# Run locally / in CI with:
#   arbigentw run --os=android --project-file=.arbigent/imancore_ux_audit.yaml \
#     --ai-type=gemini --gemini-model-name=gemini-3.5-flash-lite
settings:
  variables:
    appId: "com.imancore.app"
  # Default is 3 retries per scenario. Six scenarios on a 500-request/day free tier
  # must not spend 4x on one flaky screen.
  maxRetry: 1
  prompt:
    appUiStructure: |-
      ImanCore is an Islamic companion app for Android.
      First launch shows onboarding: Welcome (preferred name), About you (experience
      level + what to start with), Appearance (System/Light/Dark, colour palette
      swatches, font sizes, LIVE PREVIEW card), Permissions (Location, Notifications,
      Exact Alarms, Battery), then "Open ImanCore".
      Bottom navigation: Salah, Quran, Hadith, Scholar, Tools.
      Salah opens on a "Times" tab: header with date/location, "Today: X/Y Prayed"
      progress strip, prayer rows (Fajr, Dhuhr, Asr, Maghrib, Isha) with completion
      controls, and tabs "Times" / "Qibla". Qibla has Compass, Map and Sun modes.
      Quran: surah list -> reader with bookmark icons, reading-mode pills
      ("Verse by verse", "Mushaf page") and bottom controls.
      Hadith: Books / Daily / Search / Saved tabs, collection cards with an "Open"
      button, then chapters and hadith text.
      Scholar: AI chat with quick prompts and an input bar.
      Tools: sections "Islamic Tools", "Discover", "Settings", "Support & About" with
      tiles such as Visual Salah Posture Guide, Zakat & Sadaqah Jar,
      "Appearance & Reading", "Replay Quick Tour", Prayer & Location, About ImanCore.
    additionalSystemPrompts:
      - |-
        You are also a senior mobile UX reviewer. Before each action, add a short review
        of the current screen to your reply with these four labels, one line each:
        CLUTTER: how many elements compete with the main action.
        LAYOUT: alignment, spacing, clipping, overlap, content pushed off-screen.
        VISIBILITY: contrast, text size, unreadable or invisible labels.
        THEME: whether colours and typography look like a deliberate, modern Islamic app
        theme rather than Android's default Material look.
        Be specific and name the element you judge. Keep completing the goal.

scenarios:
  # ------------------------------------------------------------ onboarding
  # tree: 01-onboarding-monochrome-ux | children: 02-salah-times-ux
  - id: "01-onboarding-monochrome-ux"
    # Starts from a clean install, so onboarding is genuinely first-run on every run.
    initializationMethods:
      - type: "CleanupData"
        packageName: "{{appId}}"
      - type: "LaunchApp"
        packageName: "{{appId}}"
    goal: |-
      You are a first-time user on ImanCore's welcome step.
      0. If any Android system permission dialog appears, choose "Don't allow" (or
         dismiss it) and return to ImanCore. Never grant a system permission.
      1. Tap the "Preferred name (optional)" field, type "Faraz", dismiss the on-screen
         keyboard, then tap "Continue".
      2. Confirm step 2 greets Faraz by name ("Glad you're here, Faraz"). If the name is
         missing, note that in your review before moving on. Then select
         "Practicing Muslim", select "Prayer consistency", and tap "Continue".
      3. On the Appearance step, under Color Theme select "Dark", then select the
         monochrome palette swatch (labelled "Black & White" - pure monochrome). Check
         that the LIVE PREVIEW Arabic text and its translation are still legible in this
         pure black-and-white dark theme, then tap "Continue".
      4. On step 4, verify the heading includes "Faraz" (e.g. "Set up once, Faraz").
         Verify all four permission tiles - Location, Notifications, Exact Alarms and
         Battery - have readable button text and no blank white-on-white invisible pills.
         Scroll if needed, then tap "Open ImanCore".
    maxStep: 20
    imageAssertions:
      - assertionPrompt: "Step 4 permission buttons have high-contrast readable text with no blank white pills or clipped labels."
      - assertionPrompt: "The heading on this final onboarding step includes a personal name (Faraz) rather than only generic text."
      - assertionPrompt: "In the monochrome dark theme, all visible text - heading, permission tile titles, reasons, button labels and the primary action - is clearly readable, with no black-on-black or white-on-white elements."

  # ------------------------------------------------------------- salah
  # tree: 01-onboarding-monochrome-ux > 02-salah-times-ux | children: 03-qibla-map-and-sun-ux
  - id: "02-salah-times-ux"
    dependency: "01-onboarding-monochrome-ux"
    goal: |-
      You should now be inside ImanCore on the Salah tab, "Times" view. If another tab
      is open, tap "Salah" in the bottom bar first.
      1. Inspect the top header closely: the date line, the location/city line and any
         warning or banner text (for example a location or exact-alarm warning). Check
         whether any of these are truncated with an ellipsis, cut off, or stacked so
         thickly that they push the prayer list down and crowd it.
      2. Mark Fajr as prayed using Fajr's completion control, and verify the daily
         progress strip/counter updates from 0/5 to 1/5.
      3. Look at how a completed prayer is distinguished from the current/active prayer
         (for example the orange checkmark on Dhuhr). Judge whether completed vs active
         is unmistakable, or whether the two states look confusingly similar.
      4. Expand one prayer row (or open its details / "Step-by-Step Guide" / Visual Salah
         Guide if present), read the content, then return to the Times list.
    maxStep: 16
    imageAssertions:
      - assertionPrompt: "Prayer rows, times, and status icons are unambiguous, not cut off, and clearly distinguish completed vs. active prayers."
      - assertionPrompt: "The Salah top header shows its date and location lines completely, without truncated, clipped or ellipsised text, and the header does not crowd out the prayer list."

  # ------------------------------------------------------------- qibla
  # tree: ... > 02-salah-times-ux > 03-qibla-map-and-sun-ux | children: 04-quran-modes-and-bookmark-ux
  - id: "03-qibla-map-and-sun-ux"
    dependency: "02-salah-times-ux"
    goal: |-
      From the Salah screen, tap the "Qibla" tab.
      1. Stay in Compass mode first. Review the compass/direction indicator, the
         degree/heading readout, the location line and the badge shown on the card (for
         example "Magnet-Free"). Judge whether that badge text has readable contrast
         against its background.
      2. Tap "Sun" mode and verify it renders cleanly - real graphics and labels, not a
         blank area, an endless spinner or an error message.
      3. Tap "Map" mode LAST. Wait several seconds for map tiles to download before
         judging, and do not tap again while it loads. Then check whether an actual map
         (streets, land/water shapes, tiles) renders on screen, or whether the map area
         is an empty solid rectangle.
      4. Report which mode is currently visible and whether its content loaded.
    maxStep: 12
    imageAssertions:
      - assertionPrompt: "Qibla Map mode renders visible map tiles and graphics (NOT an empty solid rectangle) and all badges have readable contrast."
      - assertionPrompt: "The Qibla card's badge and readout text, including the 'Magnet-Free' badge, are readable with strong contrast against the monochrome dark background."

  # ------------------------------------------------------------- quran
  # tree: ... > 03-qibla-map-and-sun-ux > 04-quran-modes-and-bookmark-ux | children: 05-hadith-detail-and-tabs-ux
  - id: "04-quran-modes-and-bookmark-ux"
    dependency: "03-qibla-map-and-sun-ux"
    goal: |-
      Tap "Quran" in the bottom navigation, then open Surah Al-Fatihah.
      1. Bookmark ayah 1 using the bookmark icon on that ayah, and confirm the icon
         visibly changes to its bookmarked state (not just a toast).
      2. Find the reading-mode controls and the bottom pill bar (for example "Verse by
         verse" and "Mushaf page"). Tap each reading-mode option once and judge whether
         the layout switches cleanly, without elements overlapping or disappearing.
      3. In the reading mode that shows word-by-word or inline meanings, scroll down
         through the verses and check Arabic, transliteration and translation alignment:
         right-to-left text should not collide with Latin text, and ayah markers should
         sit at the end of each ayah.
      4. Leave the reader on a scrolled position that shows several verses.
    maxStep: 16
    imageAssertions:
      - assertionPrompt: "Quran text, word-by-word meanings, and bottom controls are well-spaced with no overlapping elements."
      - assertionPrompt: "Arabic, transliteration and translation are visually separated and aligned, with no Latin text colliding with right-to-left Arabic and no clipped ayah markers."

  # ------------------------------------------------------------- hadith
  # tree: ... > 04-quran-modes-and-bookmark-ux > 05-hadith-detail-and-tabs-ux | children: 06-scholar-and-tools-ux
  - id: "05-hadith-detail-and-tabs-ux"
    dependency: "04-quran-modes-and-bookmark-ux"
    goal: |-
      Tap "Hadith" in the bottom navigation.
      1. On the Books tab, tap "Open" on Sahih al-Bukhari. Verify the chapter/hadith list
         actually loads real content (chapter titles and counts, or hadith text) instead
         of a spinner, a blank screen or an error.
      2. Navigate back to the Hadith root.
      3. Open each of the other tabs - "Daily", "Search" and "Saved" - and check each one
         reaches a usable state: real content, or a clear intentional empty state with a
         helpful message. Note any tab that shows a blank or broken screen.
      4. Finish on the "Saved" tab so its state is judged.
    maxStep: 14
    imageAssertions:
      - assertionPrompt: "Hadith collection details and tabs load real content cleanly with legible typography."
      - assertionPrompt: "The visible Hadith tab shows either real content or a deliberate, well-designed empty state with a readable message - not a blank or broken screen."

  # ------------------------------------------------------ scholar + tools
  # tree: ... > 05-hadith-detail-and-tabs-ux > 06-scholar-and-tools-ux
  - id: "06-scholar-and-tools-ux"
    dependency: "05-hadith-detail-and-tabs-ux"
    goal: |-
      1. Tap "Scholar" in the bottom navigation. Verify the quick prompts are visible and
         that the chat input bar is fully reachable above the bottom navigation bar (not
         hidden behind it, not under the keyboard, not cut off).
      2. Tap "Tools" in the bottom navigation and scroll through the available tools
         (sections "Islamic Tools", "Discover", "Settings", "Support & About"; tiles
         include Visual Salah Posture Guide, Zakat & Sadaqah Jar, Appearance & Reading,
         and "Replay Quick Tour" - the replay-onboarding entry).
      3. Open "Appearance & Reading" (Appearance Settings), verify the theme, palette and
         typography controls are laid out cleanly, then go back.
      4. Open the "Replay Quick Tour" tile (Replay Onboarding), confirm it opens a
         confirmation or the tour, then dismiss it with "Cancel" or the X / close control
         so nothing is left mid-flow. Finish on the Tools screen.
    maxStep: 16
    imageAssertions:
      - assertionPrompt: "Scholar and Tools screens are uncluttered, responsive, and all buttons and inputs have clear contrast."
      - assertionPrompt: "The Scholar input bar and quick prompts are fully visible above the bottom navigation bar with nothing hidden behind it, and in Tools every tile label and its supporting text is readable and uncut."
